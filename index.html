<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />

    <title>VELZICO — AI Invoice Maker for Small Businesses</title>
    <meta name="description" content="Create professional invoices and estimates, manage customers, accept payments, track expenses, and run your business faster with VELZICO." />

    <!--
      canonical / og:url / og:image / twitter:image intentionally omitted —
      they need the real production domain and a hosted 1200x630 social
      share image, neither of which exist yet. Do not fill these with a
      guessed domain; add them once both are confirmed. See project README
      for the exact tags to add at that point.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VELZICO" />
    <meta property="og:title" content="VELZICO — AI Invoice Maker for Small Businesses" />
    <meta property="og:description" content="Create professional invoices and estimates, manage customers, accept payments, track expenses, and run your business faster with VELZICO." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="VELZICO — AI Invoice Maker for Small Businesses" />
    <meta name="twitter:description" content="Create professional invoices and estimates, manage customers, accept payments, track expenses, and run your business faster with VELZICO." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "VELZICO",
            "description": "AI invoicing and business management for small businesses."
          },
          {
            "@type": "WebSite",
            "name": "VELZICO",
            "publisher": { "@type": "Organization", "name": "VELZICO" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "VELZICO",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Create professional invoices and estimates, manage customers, accept payments, track expenses, and run your business faster with VELZICO.",
            "publisher": { "@type": "Organization", "name": "VELZICO" },
            "offers": [
              { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
              { "@type": "Offer", "name": "Pro", "price": "14.99", "priceCurrency": "USD" },
              { "@type": "Offer", "name": "Business", "price": "29.99", "priceCurrency": "USD" },
              { "@type": "Offer", "name": "Enterprise", "price": "99.99", "priceCurrency": "USD" }
            ]
          }
        ]
      }
    </script>
    <!--
      "operatingSystem" is deliberately "Web" only — VELZICO is not currently
      published to the App Store or Google Play, so claiming iOS/Android here
      would be false. Update this the day a native build actually ships.
      "url"/"logo"/"image" fields are omitted from every entry above for the
      same reason as the meta tags: no confirmed domain or hosted asset yet.
      Add them once both exist, then re-validate with Google's Rich Results
      Test before relying on this data in production.
    -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
